# @package _global_
# Two GPUs, one model copy: the driver alone on GPU 0; the renderer, physics, and
# traffic on GPU 1. Selected with topology=vla_on_edge_2gpu (and our hydra.searchpath).
#
# Why not AlpaSim's topology/2gpu.yaml: it runs 3 driver replicas on GPU 0, which
# cannot hold 3 copies of Alpamayo 2 Super (~70 GiB each). This file is AlpaSim's
# topology/1gpu.yaml with only the GPU assignments changed, so the 1- and 2-GPU
# layouts run the same number of workers and concurrent rollouts. AlpaSim's own
# Alpamayo eval topology (topology/8gpu_alpamayo_eval.yaml) also gives each driver
# a GPU of its own and puts the renderer and physics together on another.

defines:
  nre_cache_size: 5 # renderer.n_concurrent_rollouts + 1

trafficsim:
  server:
    max_workers: 4

services:
  renderer:
    replicas_per_container: 1
    gpus: [1]

  driver:
    replicas_per_container: 1
    gpus: [0]

  physics:
    replicas_per_container: 1
    gpus: [1]

  trafficsim:
    replicas_per_container: 1
    gpus: [1]

  controller:
    replicas_per_container: 1
    gpus: null

runtime:
  nr_workers: 1
  endpoints:
    renderer:
      n_concurrent_rollouts: 4
    driver:
      n_concurrent_rollouts: 4
    physics:
      n_concurrent_rollouts: 4
      skip: false
    controller:
      n_concurrent_rollouts: 4
    trafficsim:
      n_concurrent_rollouts: 4
