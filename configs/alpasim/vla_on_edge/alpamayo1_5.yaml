# @package _global_
# AlpaSim (Hydra) overrides that run Alpamayo 1.5 through our logging wrapper.
#
# Use together with AlpaSim's own driver config, from third_party/alpasim:
#   VLA_ON_EDGE_REPO=/path/to/vla-on-edge uv run alpasim_wizard deploy=local topology=1gpu \
#     driver=alpamayo1_5 \
#     'hydra.searchpath=[file:///path/to/vla-on-edge/configs/alpasim]' +vla_on_edge=alpamayo1_5 \
#     wizard.log_dir=... 'scenes.scene_ids=[...]'
# Everything except the wrapper's name is shared with Alpamayo 2 Super (wrapper.yaml).

defaults:
  - wrapper
  - _self_

driver:
  model:
    model_type: vla_on_edge_alpamayo1_5  # our wrapper's alpasim.models entry point
