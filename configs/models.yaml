# Model registry. The real models are added in milestone (b).
#
# `trajectory` is the shape of the model's native trajectory output. The validator
# checks outputs against it as-is (no resampling); horizon_s must equal
# waypoint_count * spacing_s.

models:
  dummy:
    adapter: dummy           # random valid actions, for testing the pipeline
    variant: bf16            # not meaningful for the dummy; kept so every entry has one
    reasoning: false
    seed: 0
    trajectory:              # matches the controller's expansion of meta-actions
      waypoint_count: 6
      spacing_s: 0.5
      horizon_s: 3.0
